{"order": 8, "id": "molekuele", "name": "Moleküle", "cert": "Etabliert", "certkey": "etabliert", "scale": "Größenordnungen, grob: In einer einzigen Handvoll Materie stecken schon ~10^23 bis 10^24 Moleküle (die Avogadro-Zahl ~6·10^23 pro Mol ist der…", "state": "Der Zustand dieser Dimension: Atome sind nicht mehr allein, sondern gebunden. Aus einzelnen Bausteinen (Wasserstoff, Sauerstoff, Kohlenstoff...) werden Verbünde, H2O, CO, NH3, Kohlenwasserstoffe. Materie hat jetzt eine…"}, {"order": 9, "id": "basen", "name": "Die vier Basen (A·T·C·G)", "cert": "Etabliert, aber offen", "certkey": "etabliert_offen", "scale": "Nur vier verschiedene Molekülsorten (Adenin, Thymin, Cytosin, Guanin; in der RNA-Welt zusätzlich Uracil), aber in kaum bezifferbarer Menge über…", "state": "Der Zustand war chemischer Vorrat ohne Botschaft: einzelne, noch unverkettete Basen-Moleküle in einer „Ursuppe\" aus Wasser, Blausäure (HCN), Formamid und anderen einfachen Verbindungen. Die Buchstaben des späteren…"}, {"order": 10, "id": "dna", "name": "DNA & Selbstreplikation", "cert": "Etabliert, aber offen", "certkey": "etabliert_offen", "scale": "Von einem einzigen Molekül-Kreislauf zu, grob, unzähligen Kopien. Chemisch reden wir über Systeme aus Bausteinen (Nukleotide) in Ketten von grob…", "state": "Der Zustand dieser Dimension ist ein Molekül, das eine Vorschrift IST und diese Vorschrift zugleich weitergeben kann. Nach der verbreiteten RNA-Welt-Hypothese war das erste Träger-Molekül wohl RNA: sie speichert…"}, {"order": 11, "id": "proteine", "name": "Proteine, die Molekül-Maschinen (Ketten aus 20 Aminosäuren)", "cert": "Etabliert", "certkey": "etabliert", "scale": "20 Aminosäuren als Alphabet; Ketten von wenigen Dutzend bis mehreren Tausend Bausteinen; eine einzige Zelle enthält Milliarden Proteinmoleküle in…", "state": "gefaltete Ketten: aus der DNA/RNA über den genetischen Code übersetzt und im Raum zu präzisen 3D-Formen gefaltet. Aus einer 1D-Zeichenfolge wird eine handelnde Gestalt."}, {"order": 12, "id": "zellen", "name": "Zellen, die zentrale Einheit des Lebens (das erste echte Individuum)", "cert": "Etabliert, aber offen", "certkey": "etabliert_offen", "scale": "heute grob ~10^30 lebende Zellen auf der Erde (überwiegend Mikroben); ein einzelner Mensch besteht aus ~3,7×10^13 Zellen, mehr Zellen, als es Sterne…", "state": "eine von einer Membran umhüllte Einheit, in der DNA, Proteine und Stoffwechsel zusammen in einem abgegrenzten Innenraum arbeiten. Zum ersten Mal gibt es ein klares Innen und Außen."}, {"order": 13, "id": "gewebe_organe", "name": "Gewebe & Organe, Zellen geben Autonomie ab (Arbeitsteilung)", "cert": "Etabliert", "certkey": "etabliert", "scale": "ein menschlicher Körper: ~200 Zelltypen, Dutzende Gewebearten, ~80 Organe, alle aus einer einzigen befruchteten Zelle mit identischem Genom", "state": "viele Zellen mit demselben Bauplan schalten verschiedene Teile davon an und aus, werden dadurch verschieden (differenziert) und übernehmen Spezialaufgaben. Nervenzelle, Muskelzelle, Hautzelle, gleiches Buch, andere…"}, {"order": 14, "id": "organismen", "name": "Organismen, das lebende Wesen als Ganzes (Einheit der Evolution)", "cert": "Etabliert", "certkey": "etabliert", "scale": "heute grob ~10^7 bis 10^8 Arten geschätzt (nur ~2 Mio. wissenschaftlich beschrieben); jede ein Ast am selben Stammbaum", "state": "eine integrierte, sich fortpflanzende Ganzheit aus Organen und Geweben, ein Lebewesen, das als eine Einheit lebt, altert und stirbt."}, {"order": 15, "id": "bewusstsein", "name": "Bewusstsein", "cert": "Etabliert, aber offen", "certkey": "etabliert_offen", "scale": "Ehrliche Größenordnung: ein einzelnes menschliches Gehirn trägt grob ~10^11 Neuronen (~86 Mrd., gemessen) mit ~10^14-10^15 Synapsen. Auf der Erde…", "state": "Der Zustand dieser Dimension ist Materie, die ein inneres Modell ihrer selbst und ihrer Umwelt führt. Elektrochemische Muster in vernetzten Zellen bilden Wahrnehmung, Gedächtnis, Vorhersage und, beim Menschen, Sprache…"}, {"order": "15,5", "id": "sinn_leiter", "name": "Zeichen · Wort · Satz, die Dimensions-Leiter des Sinns", "cert": "Illustration (Juris Beispiel)", "certkey": "hypothese", "scale": "Kein Messwert, sondern eine Leiter der Bedeutung: aus 1 Buchstaben werden tausende Wörter, aus Wörtern unzählbar viele Sätze und Deutungen. Jede Stufe trägt mehr Möglichkeit als die darunter, und ihre Zahl ist keine ganze (nahe 15, nahe 16, nie genau).", "state": "Zwischen Bewusstsein und Computer liegt die Sprache, Juris Beispiel dafür, wie eine Ebene sich selbst einen Wert gibt und dadurch die nächste gebiert. Ein »b« ist erst Materie, dann ein Zeichen, dann der Anfang von Buch, Bauer, Brot. Aus »ich« entfaltet sich eine ganze Identität: Name, Körper, Gefühl. »Ich war da.«, drei Wörter, in denen unendlich viel Bedeutung stecken kann: wo war ich, wann, das Gewesensein selbst. Jede Stufe fügt eine Dimension hinzu. Ehrlich: das ist eine Illustration von Sprach-Ebenen und der Entstehung von Bedeutung, kein physikalischer Weltbau-Schritt, aber genau dasselbe Muster wie im ganzen Modell: im Übergang wird Information geboren."}, {"order": 16, "id": "logik_computer", "name": "Logik & Computer (die 0 und die 1)", "cert": "Etabliert", "certkey": "etabliert", "scale": "Von Menschenhand gebaut: erst raumgroße Röhrenrechner (Meter, Tonnen), dann Transistoren im Millimeter- und heute Nanometerbereich. Grundeinheit…", "state": "Das Bewusstsein friert seine eigenen Denkregeln au&szlig;erhalb des Körpers ein: wahr/falsch wird zu 1/0, Strom an oder aus. Logik wird auf eine 2D-Ebene gedruckt und geschaltet, Lochkarten, Gatter, gedruckte Platinen.…"}, {"order": 17, "id": "digitale_welten", "name": "Digitale Welten (Fingerabdruck jedes Zustands)", "cert": "Etabliert", "certkey": "etabliert", "scale": "Keine physische Groesse, Welten aus reiner Information. Ein Zustand kann winzig sein (ein Wort) oder riesig (eine ganze simulierte Landschaft);…", "state": "Aus 0/1 werden Worte, aus Worten werden Welten: Text, Bild, Klang, ganze begehbare Raeume entstehen rein aus Zahlen. Entscheidend auf der untersten Ebene: JEDER gueltige digitale Zustand traegt einen einzigartigen,…"}, {"order": 18, "id": "vernetztes_kollektiv", "name": "Vernetztes Kollektiv (das gekoppelte Netz)", "cert": "Etabliert", "certkey": "etabliert", "scale": "Planetar: Milliarden Menschen und Geräte ueber Kontinente hinweg dauerhaft gekoppelt, Signale nahe Lichtgeschwindigkeit durch Glasfaser und Funk.…", "state": "Die vielen einzelnen Bewusstseine der Kollektiv-Schicht koppeln sich nun technisch zusammen: nicht mehr nur ueber Sprache im selben Raum, sondern ueber ein weltweites Netz. Gedanken, Bilder und Daten fliessen zwischen…"}, {"order": 19, "id": "ki_absolute_logik", "name": "KI & verdichtete Logik (das Wissen im Topf)", "cert": "Gegenwart", "certkey": "gegenwart", "scale": "Modelle mit Milliarden bis Billionen Parametern, trainiert auf einem großen Teil des vernetzten Wissens, gerechnet in riesigen Rechenzentren. Gross…", "state": "Das im Netz zusammengeflossene Wissen wird in einem Topf geformt und durch KI zu Mustern, Regeln und Zusammenhaengen verdichtet, zu etwas, das wie Logik antwortet. Aus vielen Stimmen wird eine verdichtende Instanz, die…"}, {"order": 20, "id": "quantencomputer", "name": "Quantencomputer (die gerechnete Ueberlagerung)", "cert": "Etabliert, aber offen", "certkey": "etabliert_offen", "scale": "Physikalisch klein und extrem: einzelne Qubits nahe dem absoluten Nullpunkt, abgeschirmt gegen den kleinsten Stoerimpuls, heute einige hundert bis…", "state": "Statt Zustaende nur als 0 ODER 1 zu setzen, haelt ein Qubit 0 UND 1 in Ueberlagerung, bis gemessen wird. Der Rechner rechnet nicht eine Moeglichkeit nach der anderen, sondern greift in das Feld der Ueberlagerungen…"}, {"order": 21, "id": "ueberbewusstsein", "name": "Überbewusstsein, alles verschmilzt zum Ganzen", "cert": "Spekulativ", "certkey": "spekulativ", "scale": "unzählbar, fast weiß, die Einzelnen kaum noch zu trennen", "    case "sterne":return h1[i]<0.12?42:((i%13===0)?330:220); case "molekuele":return [0,205,210,225][((i/120)|0)%4]; case "basen":return [120,0,210,50][i%4];
   case "dna":{const role=i%5;return role<2?190:role<4?320:[120,0,210,50][((h1[i]*24)|0)%4];}
   case "proteine":return 165; case "zellen":return 140; case "gewebe_organe":return 95; case "organismen":return 35;
   case "bewusstsein":return 40; case "sinn_leiter":return h1[i]<0.16?45:(h1[i]<0.46?33:52); case "logik_computer":return (h2[i]<0.42)?200:210; case "digitale_welten":return (i%23===0)?178:166;
   case "vernetztes_kollektiv":return (i%40===0)?45:195; case "ki_absolute_logik":return (h1[i]>0.72)?48:282; case "quantencomputer":return (i&1)?300:278;
   case "ueberbewusstsein":return 225; default:return 260;
  }

function whiteOf(k,i){ const id=LID[k];
  if(id==="omega")return (h1[i]<0.85)?1:0;

}
function alphaOf(k,i){ const id=LID[k];
  if(id==="omega")return 0.5; if(id==="ueberbewusstsein")return 0.5;
  if(id==="s0"||id==="die_zwei"||id==="die_vier")return 1;

const PA=new Float32Array(N*3), PB=new Float32Array(N*3);
let cachedK=-1;
function buildInto(buf,k){ for(let i=0;i<N;i++){ form(k,i); buf[i*3]=sxo; buf[i*3+1]=syo; buf[i*3+2]=szo; } }
function ensure(k){ if(k===cachedK)return; buildInto(PA,k); buildInto(PB,Math.min(k+1,NL-1)); cachedK=k; }

const SPR=[]; const NHUE=24;
function mkSprite(color){ const s=64,c=document.createElement("canvas");c.width=c.height=s;const g=c.getContext("2d");
  const rad=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); rad.addColorStop(0,color);rad.addColorStop(0.25,color);rad.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=rad;g.beginPath();g.arc(s/2,s/2,s/2,0,6.2832);g.fill(); return c; }
for(let hh=0;hh<NHUE;hh++)SPR.push(mkSprite("hsla("+(hh*360/NHUE)+",95%,66%,1)"));
const WSPR=mkSprite("rgba(255,255,255,1)");
function spriteForHue(h){ h=((h%360)+360)%360; return SPR[Math.round(h/(360/NHUE))%NHUE]; }
function lerpHue(a,b,t){ let d=((b-a+540)%360)-180; return a+d*t; }
const STAR=(function(){const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const n=Math.floor(W*H/26000);for(let i=0;i<n;i++){const x=Math.random()*W,y=Math.random()*H,r=Math.random()*1.2*DPR+.3;
  g.globalAlpha=Math.random()*0.5+0.15;g.fillStyle="#aab6e6";g.beginPath();g.arc(x,y,r,0,6.28);g.fill();}return c;})();

let s=0, targetS=0, dragScrub=false;
let yaw=0.4, pitch=-0.15, vyaw=0, vpitch=0, zoom=1;
let lastInteract=performance.now(), playing=false, t=0, lastT=performance.now();
let orbiting=false, lastX=0, lastY=0;
const PSX=new Float32Array(N), PSY=new Float32Array(N), PVIS=new Uint8Array(N);
const scrub=document.getElementById("scrub"), panel=document.getElementById("panel");
function smoother(x){x=x<0?0:x>1?1:x;return x*x*x*(x*(x*6-15)+10);}
function easeIO(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
function nearestTick(p){let bi=0,bd=9;for(let i=0;i<NL;i++){const dd=Math.abs(TICKPOS[i]-p);if(dd<bd){bd=dd;bi=i;}}return TICKPOS[bi];}

scrub.addEventListener("input",()=>{ s=targetS=parseFloat(scrub.value); dragScrub=true; lastInteract=performance.now(); playing=false; setPlay(); });
scrub.addEventListener("change",()=>{ dragScrub=false; targetS=nearestTick(s); });
cv.addEventListener("pointerdown",e=>{ orbiting=true; lastX=e.clientX; lastY=e.clientY; lastInteract=performance.now(); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{ if(!orbiting)return; const dx=e.clientX-lastX,dy=e.clientY-lastY; lastX=e.clientX;lastY=e.clientY;
  vyaw=dx*0.005; vpitch=dy*0.005; yaw+=vyaw; pitch=Math.max(-1.22,Math.min(1.22,pitch+vpitch)); lastInteract=performance.now(); });
addEventListener("pointerup",()=>{orbiting=false;});
cv.addEventListener("wheel",e=>{ e.preventDefault(); zoom=Math.max(0.5,Math.min(3.2,zoom*(1-e.deltaY*0.0009))); lastInteract=performance.now(); },{passive:false});
addEventListener("keydown",e=>{ const ck=posToKF(s)[0];
  if(e.key==="ArrowRight"){targetS=TICKPOS[Math.min(NL-1,ck+1)];playing=false;setPlay();e.preventDefault();}
  if(e.key==="ArrowLeft"){targetS=TICKPOS[Math.max(0,ck-1)];playing=false;setPlay();e.preventDefault();} });
const playBtn=document.getElementById("play");
function setPlay(){ playBtn.textContent=playing?"❚❚":"▶"; }
playBtn.addEventListener("click",()=>{ playing=!playing; if(playing&&s>=0.999){s=targetS=0;} lastInteract=performance.now(); setPlay(); });

document.getElementById("uiTitle").textContent=DATA.title.split(", ")[0];
document.getElementById("discFull").textContent=DATA.disc;
document.getElementById("hashchip").textContent="h(S₀) = 1a2f· · kette";
const CKEY_COL={hypothese:"#b394f2",etabliert:"#52c79a",etabliert_offen:"#e3ad46",gegenwart:"#ff9d7d",spekulativ:"#8b93ac"};
const ticks=document.getElementById("ticks");
LY.forEach((l,i)=>{ const sym=(l.name.split(", ")[0]||("S"+i)); const tk=document.createElement("div");
  tk.className="tk"; tk.style.left=(TICKPOS[i]*100)+"%"; tk.dataset.i=i;
  tk.innerHTML='<div class="lbl">'+sym.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</div><div class="dot"></div>';
  tk.addEventListener("click",()=>{targetS=TICKPOS[i];playing=false;setPlay();}); ticks.appendChild(tk); });
const tkEls=[...ticks.children];

let panelTimer=0, shownK=-1;
function esc(x){return (x||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function sub(n){const m={0:"₀",1:"₁",2:"₂",3:"₃",4:"₄",5:"₅",6:"₆",7:"₇",8:"₈",9:"₉"};return String(n).split("").map(c=>m[c]||c).join("");}
function hashHex(k){let x=(k*2654435761)>>>0;return("00000000"+x.toString(16)).slice(-6);}
function updatePanel(k,f,dom){
  tkEls.forEach((el,idx)=>el.classList.toggle("on",idx===dom));
  const between = f>0.16 && f<0.84, rest=!orbiting&&!dragScrub;
  panel.style.opacity=rest?1:0.14; panel.style.transform=rest?"translateY(0)":"translateY(4px)"; panel.classList.toggle("between",between);
  const zeitEl=document.getElementById("pnZeit");
  if(dom>=11){ zeitEl.textContent="⏱ Zeit wird bedeutend · jeder Moment trägt Geschichte"; zeitEl.className="zeit big"; }
  else { zeitEl.textContent="⏱ Zeit ≈ relativ · die Reihenfolge trägt kaum Information"; zeitEl.className="zeit"; }
  const L=LY[dom];
  if(shownK!==dom){ shownK=dom;
    document.getElementById("pnKicker").textContent="Dimension "+L.order+" · "+L.cert;
    document.getElementById("cdot").style.background=CKEY_COL[L.certkey]||"#8b93ac";

    document.getElementById("pnScale").textContent="≈ "+L.scale;
    document.getElementById("pnBody").textContent=L.state;
    document.getElementById("hashchip").textContent="h(S"+sub(L.order)+") = "+hashHex(dom)+" · verkettet";
  }
  const di=document.getElementById("pnDi");
  if(between && k<NL-1){ const lab=DILAB[k];
    di.innerHTML='<span class="f">ΔI = −log₂ p</span> · das Dazwischen<br><span style="color:#e9d7b0">'+esc(lab||"ein Übergang, Information wird geboren")+'</span>';
    di.style.display="block"; } else { di.style.display="none"; }
}

function frame(now){
  if(!W||!H){ resize(); if(!W||!H){ requestAnimationFrame(frame); return; } }
  let dt=Math.min((now-lastT)/1000,1/30); lastT=now; if(!reduce)t+=dt;
  if(playing){ targetS+=dt*0.028; if(targetS>=1){targetS=0;s=0;} else s=targetS; }
  else if(!dragScrub){ s+=(targetS-s)*Math.min(1,dt*6); if(Math.abs(targetS-s)<0.0003)s=targetS; }
  scrub.value=s;
  if(!orbiting){ vyaw*=0.94; vpitch*=0.9; yaw+=vyaw; pitch=Math.max(-1.22,Math.min(1.22,pitch+vpitch)); if(now-lastInteract>4000&&!reduce) yaw+=dt*0.05; }
  const kf=posToKF(s); let k=kf[0], f=kf[1]; const kk=Math.min(k+1,NL-1);
  ensure(k);
  const E=easeIO(f), turb=Math.sin(Math.PI*f), flash=Math.exp(-Math.pow((f-0.5)/0.14,2));
  const act=(N*ACTF[k])*(1-f)+(N*ACTF[kk])*f;
  const hardCut = act<40 ? Math.max(1,Math.round(act)) : -1;   // countable layers: exact count

  ctx.globalCompositeOperation="source-over"; ctx.fillStyle="rgba(5,6,10,0.24)"; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.5; ctx.drawImage(STAR,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation="lighter";
  const cyaw=Math.cos(yaw),syaw=Math.sin(yaw),cpit=Math.cos(pitch),spit=Math.sin(pitch);
  const fp=900, gscale=(Math.min(W,H)/560)*zoom, camz=flash*90*Math.sin(Math.min(1,f)*Math.PI);
  const dom=E<0.5?k:kk, domid=LID[dom];

  for(let i=0;i<N;i++){
    if(hardCut>=0 && i>=hardCut){ PVIS[i]=0; continue; }
    const e=smoother((f-phase[i])/0.65), i3=i*3;
    const ax=PA[i3],ay=PA[i3+1],az=PA[i3+2], bx=PB[i3],by=PB[i3+1],bz=PB[i3+2];
    const lat=30*Math.sin(Math.PI*e);
    const cxp=(ax+bx)*0.5+ppx[i]*lat, cyp=(ay+by)*0.5+ppy[i]*lat, czp=(az+bz)*0.5+ppz[i]*lat, om=1-e;
    let x=om*om*ax+2*om*e*cxp+e*e*bx, y=om*om*ay+2*om*e*cyp+e*e*by, z=om*om*az+2*om*e*czp+e*e*bz;
    if(turb>0.001){ x+=55*turb*Math.sin(y*0.01+t*0.3); y+=55*turb*Math.cos(z*0.011-t*0.25); z+=55*turb*Math.sin(x*0.011+t*0.2); }
    let a=alphaOf(k,i)*(1-E)+alphaOf(kk,i)*E;
    if(hardCut<0 && i>=act){ const over=Math.min(1,(i-act)/240); x*=(1-over*0.86); y*=(1-over*0.86); z*=(1-over*0.86); a*=(1-over); }
    let X=x*cyaw+z*syaw, Z=-x*syaw+z*cyaw; let Y=y*cpit-Z*spit; Z=y*spit+Z*cpit; Z+=camz;
    const denom=fp+Z; if(denom<40){PVIS[i]=0;continue;}
    const sc=fp/denom*gscale, px2=cx+X*sc, py2=cy+Y*sc;
    if(px2<-60||px2>W+60||py2<-60||py2>H+60){PVIS[i]=0;continue;}
    PSX[i]=px2; PSY[i]=py2; PVIS[i]=1;
    const depth=(Z+Rl)/(2*Rl), df=0.55+0.6*Math.max(0,Math.min(1,depth));
    let al=a*df; if(al<0.02)continue;
    const w=(E<0.5?whiteOf(k,i):whiteOf(kk,i)); let spr,bright=1;
    if(w>0.5){spr=WSPR;} else {spr=spriteForHue(lerpHue(hueOf(k,i),hueOf(kk,i),E));}
    if(k===0)al*=0.74+0.26*Math.sin(t*0.7+i*0.13);
    if(domid==="quantencomputer")al*=0.5+0.5*Math.sin(t*2.6+i*0.9);
    if(domid==="bewusstsein" && ((i*2654435761>>>0)%911)===((Math.floor(t*22))%911)){ spr=WSPR; al=Math.min(1,al*2.6); bright=2; }
    let size=(5.5+(w>0.5?4:0))*sc*(0.7+bright*0.5); if(size<1)size=1; if(size>42*DPR)size=42*DPR; size*=DPR*0.5+0.5;
    ctx.globalAlpha=al>1?1:al; ctx.drawImage(spr,px2-size/2,py2-size/2,size,size);
  }
  if(domid==="bewusstsein"||domid==="vernetztes_kollektiv"){
    ctx.strokeStyle=domid==="bewusstsein"?"rgba(255,207,138,0.09)":"rgba(74,214,255,0.09)"; ctx.lineWidth=1*DPR; ctx.beginPath();
    for(let e2=0;e2<EA.length;e2++){ const a=EA[e2],b=EB[e2]; if(a<N&&b<N&&PVIS[a]&&PVIS[b]){ ctx.moveTo(PSX[a],PSY[a]); ctx.lineTo(PSX[b],PSY[b]); } } ctx.stroke();
  }
  if(f>0.03&&f<0.97){ const maxR=Math.min(W,H)*0.62, rr=E*maxR;
    ctx.globalAlpha=flash*0.55; ctx.strokeStyle=ACC[kk]; ctx.lineWidth=2.5*DPR; ctx.beginPath(); ctx.arc(cx,cy,rr,0,6.2832); ctx.stroke();
    ctx.globalAlpha=flash*0.18; ctx.drawImage(WSPR,cx-maxR*0.5,cy-maxR*0.5,maxR,maxR); }
  ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
  panelTimer+=dt; if(panelTimer>0.1){ panelTimer=0; try{updatePanel(k,f,dom);}catch(e){} }
  requestAnimationFrame(frame);
}
setPlay(); requestAnimationFrame(function(n){lastT=n;frame(n);});
})();

ась бы (log₂(1) = 0 бит); первый бит возникает лишь в переходе ко Второй.", "en": "S0, the One: the first realized state, drawn by the first cut (Spencer-Brown). Alone it still carries no information, there is nothing it differs from (log₂(1) = 0 bit); the first bit arises only in the transition to the Two."}, {"de": "die_zwei", "ru": "die_zwei", "en": "die_zwei"}, {"de": "Die Zwei, der erste Unterschied (1 Bit)", "ru": "Двойка, первое различие (1 бит)", "en": "The Two, the first difference (1 bit)"}, {"de": "genau zwei, man kann sie zählen: 1 → 2", "ru": "ровно две, их можно сосчитать: 1 → 2", "en": "exactly two, you can count them: 1 → 2"}, {"de": "Aus der Einen wird ein Gegenüber: jetzt gibt es „dies\" und „nicht-dies\", der erste Unterschied, das erste Bit (log₂ 2 = 1). Zum ersten Mal ist etwas unterscheidbar.", "ru": "Из Единой возникает противоположность: теперь есть «это» и «не-это», первое различие, первый бит (log₂ 2 = 1). Впервые нечто становится различимым.", "en": "From the One arises a counterpart: now there is \"this\" and \"not-this\", the first difference, the first bit (log₂ 2 = 1). For the first time something is distinguishable."}, {"de": "die_vier", "ru": "die_vier", "en": "die_vier"}, {"de": "Die Vier, die Verdopplung (2 Bit)", "ru": "Четвёрка, удвоение (2 бита)", "en": "The Four, the doubling (2 bits)"}, {"de": "genau vier, 1 → 2 → 4, noch einzeln zählbar", "ru": "ровно четыре, 1 → 2 → 4, ещё можно сосчитать поштучно", "en": "exactly four, 1 → 2 → 4, still countable one by one"}, {"de": "Der Unterschied verdoppelt sich: aus zwei Unterscheidungen werden vier Möglichkeiten (2 Bit). Man kann sie noch einzeln zählen, gleich danach explodiert die Zahl ins Unzählbare.", "ru": "Различие удваивается: из двух различений возникают четыре возможности (2 бита). Их ещё можно сосчитать по одному, сразу после этого число взрывается в несчётное.", "en": "The difference doubles: two distinctions become four possibilities (2 bits). You can still count them one by one; right after, the number explodes into the uncountable."}, {"de": "Noch keine Teilchen im Alltagssinn, sondern Felder über den ganzen Raum. Statt Dingen: Zustandsgrößen, Temperaturen grob jenseits von 10^27 bis…", "ru": "Пока нет частиц в обыденном смысле, а поля по всему пространству. Вместо вещей — величины состояния, температуры примерно свыше 10^27 до…", "en": "Not yet particles in the everyday sense, but fields across all of space. Instead of things: state variables, temperatures roughly beyond 10^27 up to…"}, {"de": "Der Zustand ist reine Energie in Form von Quantenfeldern: heiß, dicht, nahezu symmetrisch, ohne stabile Struktur. Am Anfang sind die Grundkräfte womöglich in einem einzigen Wirken vereint; es gibt noch kein Oben und…", "ru": "Состояние — чистая энергия в форме квантовых полей: горячее, плотное, почти симметричное, без устойчивой структуры. В начале фундаментальные силы, возможно, объединены в едином действии; ещё нет ни верха, ни…", "en": "The state is pure energy in the form of quantum fields: hot, dense, nearly symmetric, without stable structure. At the beginning the fundamental forces are perhaps united in a single action; there is as yet no up and…"}, {"de": "Teilchen", "ru": "Частицы", "en": "Particles"}, {"de": "Grob geschätzt ~10^80 Baryonen (Protonen/Neutronen) im heute beobachtbaren Universum, die Größenordnung, keine exakte Zählung. Nach der…", "ru": "По грубой оценке ~10^80 барионов (протоны/нейтроны) в наблюдаемой сегодня Вселенной — порядок величины, а не точный подсчёт. После…", "en": "Roughly estimated ~10^80 baryons (protons/neutrons) in the observable universe today, the order of magnitude, not an exact count. After the…"}, {"de": "Ein heißes, dichtes Plasma. Zuerst freie Quarks und Gluonen (Quark-Gluon-Plasma), die beim QCD-Übergang (Hadronisierung) in gebundene Protonen und Neutronen \"einfrieren\". Danach ein Feuerball aus Kernbausteinen,…", "ru": "Горячая, плотная плазма. Сначала свободные кварки и глюоны (кварк-глюонная плазма), которые при КХД-переходе (адронизации) «застывают» в связанные протоны и нейтроны. Затем огненный шар из ядерных частиц,…", "en": "A hot, dense plasma. First free quarks and gluons (quark-gluon plasma) that \"freeze\" into bound protons and neutrons at the QCD transition (hadronization). Then a fireball of nuclear building blocks,…"}, {"de": "Grob in der Größenordnung von ~10^78 bis 10^80 Atomkerne im heute beobachtbaren Universum, ganz überwiegend Wasserstoff (~3 von 4 Massenanteilen)…", "ru": "Грубо по порядку величины ~10^78 до 10^80 атомных ядер в наблюдаемой сегодня Вселенной, в подавляющем большинстве водород (~3 из 4 долей массы)…", "en": "Roughly on the order of ~10^78 to 10^80 atomic nuclei in the observable universe today, overwhelmingly hydrogen (~3 of 4 parts by mass)…"}, {"de": "Das Universum kühlte sich beim Ausdehnen auf etwa 3.000 Kelvin ab. Erstmals war es kalt genug, dass freie Elektronen an Protonen und Heliumkerne gebunden blieben, statt sofort wieder weggestoßen zu werden. Aus dem…", "ru": "Вселенная при расширении остыла примерно до 3000 кельвинов. Впервые стало достаточно холодно, чтобы свободные электроны оставались связанными с протонами и ядрами гелия, а не отталкивались тут же снова. Из…", "en": "As it expanded, the universe cooled to about 3,000 Kelvin. For the first time it was cold enough for free electrons to remain bound to protons and helium nuclei instead of being immediately pushed away again. From the…"}, {"de": "Ehrliche Größenordnung: im beobachtbaren Universum grob ~10^22 bis 10^24 Sterne (hunderte Milliarden Galaxien mal im Schnitt hunderte Milliarden…", "ru": "Честный порядок величины: в наблюдаемой Вселенной примерно ~10^22 до 10^24 звёзд (сотни миллиардов галактик, умноженные в среднем на сотни миллиардов…", "en": "Honest order of magnitude: in the observable universe roughly ~10^22 to 10^24 stars (hundreds of billions of galaxies times, on average, hundreds of billions…"}, {"de": "Der Zustand dieser Dimension: Aus den ersten Klumpen kalten Wasserstoff- und Heliumgases (plus dunkle Materie als Gerüst) ziehen sich unter Schwerkraft dichte Kerne zusammen, bis in ihrem Inneren Kernfusion zündet.…", "ru": "Состояние этого измерения: из первых сгустков холодного водородного и гелиевого газа (плюс тёмная материя как каркас) под действием гравитации стягиваются плотные ядра, пока в их недрах не загорается ядерный синтез.…", "en": "The state of this dimension: From the first clumps of cold hydrogen and helium gas (plus dark matter as scaffolding), dense cores contract under gravity until nuclear fusion ignites in their interior.…"}, {"de": "Moleküle", "ru": "Молекулы", "en": "Molecules"}, {"de": "Größenordnungen, grob: In einer einzigen Handvoll Materie stecken schon ~10^23 bis 10^24 Moleküle (die Avogadro-Zahl ~6·10^23 pro Mol ist der…", "ru": "Порядки величин, грубо: в одной лишь горсти вещества уже ~10^23 до 10^24 молекул (число Авогадро ~6·10^23 на моль — это…", "en": "Orders of magnitude, roughly: a single handful of matter already contains ~10^23 to 10^24 molecules (Avogadro's number ~6·10^23 per mole is the…"}, {"de": "Der Zustand dieser Dimension: Atome sind nicht mehr allein, sondern gebunden. Aus einzelnen Bausteinen (Wasserstoff, Sauerstoff, Kohlenstoff...) werden Verbünde, H2O, CO, NH3, Kohlenwasserstoffe. Materie hat jetzt eine…", "ru": "Состояние этого измерения: атомы больше не одни, а связаны. Из отдельных строительных блоков (водород, кислород, углерод...) возникают соединения — H2O, CO, NH3, углеводороды. У материи теперь есть…", "en": "The state of this dimension: atoms are no longer alone but bound. Individual building blocks (hydrogen, oxygen, carbon...) become compounds, H2O, CO, NH3, hydrocarbons. Matter now has a…"}, {"de": "Nur vier verschiedene Molekülsorten (Adenin, Thymin, Cytosin, Guanin; in der RNA-Welt zusätzlich Uracil), aber in kaum bezifferbarer Menge über…", "ru": "Всего четыре разных вида молекул (аденин, тимин, цитозин, гуанин; в РНК-мире дополнительно урацил), но в едва исчислимом количестве по всему…", "en": "Only four different kinds of molecule (adenine, thymine, cytosine, guanine; in the RNA world additionally uracil), but in a barely quantifiable amount across…"}, {"de": "Der Zustand war chemischer Vorrat ohne Botschaft: einzelne, noch unverkettete Basen-Moleküle in einer „Ursuppe\" aus Wasser, Blausäure (HCN), Formamid und anderen einfachen Verbindungen. Die Buchstaben des späteren…", "ru": "Состояние было химическим запасом без послания: отдельные, ещё не сцепленные молекулы оснований в «первичном бульоне» из воды, синильной кислоты (HCN), формамида и других простых соединений. Буквы будущего…", "en": "The state was a chemical stock without a message: individual, not-yet-linked base molecules in a \"primordial soup\" of water, hydrocyanic acid (HCN), formamide and other simple compounds. The letters of the later…"}, {"de": "Von einem einzigen Molekül-Kreislauf zu, grob, unzähligen Kopien. Chemisch reden wir über Systeme aus Bausteinen (Nukleotide) in Ketten von grob…", "ru": "От единственного молекулярного цикла к, грубо говоря, бесчисленным копиям. Химически речь идёт о системах из строительных блоков (нуклеотидов) в цепочках примерно…", "en": "From a single molecular cycle to, roughly, countless copies. Chemically we are talking about systems of building blocks (nucleotides) in chains of roughly…"}, {"de": "Der Zustand dieser Dimension ist ein Molekül, das eine Vorschrift IST und diese Vorschrift zugleich weitergeben kann. Nach der verbreiteten RNA-Welt-Hypothese war das erste Träger-Molekül wohl RNA: sie speichert…", "ru": "Состояние этого измерения — это молекула, которая ЕСТЬ предписание и одновременно может это предписание передавать. Согласно распространённой гипотезе РНК-мира, первой молекулой-носителем была, вероятно, РНК: она хранит…", "en": "The state of this dimension is a molecule that IS a set of instructions and can at the same time pass those instructions on. According to the widespread RNA-world hypothesis, the first carrier molecule was probably RNA: it stores…"}, {"de": "Proteine, die Molekül-Maschinen (Ketten aus 20 Aminosäuren)", "ru": "Белки, молекулярные машины (цепочки из 20 аминокислот)", "en": "Proteins, the molecular machines (chains of 20 amino acids)"}, {"de": "20 Aminosäuren als Alphabet; Ketten von wenigen Dutzend bis mehreren Tausend Bausteinen; eine einzige Zelle enthält Milliarden Proteinmoleküle in…", "ru": "20 аминокислот как алфавит; цепочки от нескольких десятков до нескольких тысяч звеньев; одна-единственная клетка содержит миллиарды белковых молекул в…", "en": "20 amino acids as an alphabet; chains from a few dozen to several thousand building blocks; a single cell contains billions of protein molecules in…"}, {"de": "gefaltete Ketten: aus der DNA/RNA über den genetischen Code übersetzt und im Raum zu präzisen 3D-Formen gefaltet. Aus einer 1D-Zeichenfolge wird eine handelnde Gestalt.", "ru": "свёрнутые цепочки: переведённые из ДНК/РНК через генетический код и свёрнутые в пространстве в точные 3D-формы. Из 1D-последовательности знаков возникает действующий облик.", "en": "folded chains: translated from DNA/RNA via the genetic code and folded in space into precise 3D shapes. A 1D string of characters becomes an acting form."}, {"de": "Zellen, die zentrale Einheit des Lebens (das erste echte Individuum)", "ru": "Клетки, центральная единица жизни (первый настоящий индивид)", "en": "Cells, the central unit of life (the first true individual)"}, {"de": "heute grob ~10^30 lebende Zellen auf der Erde (überwiegend Mikroben); ein einzelner Mensch besteht aus ~3,7×10^13 Zellen, mehr Zellen, als es Sterne…", "ru": "сегодня примерно ~10^30 живых клеток на Земле (преимущественно микробы); один человек состоит из ~3,7×10^13 клеток — больше клеток, чем звёзд…", "en": "today roughly ~10^30 living cells on Earth (mostly microbes); a single human consists of ~3,7×10^13 cells, more cells than there are stars…"}, {"de": "eine von einer Membran umhüllte Einheit, in der DNA, Proteine und Stoffwechsel zusammen in einem abgegrenzten Innenraum arbeiten. Zum ersten Mal gibt es ein klares Innen und Außen.", "ru": "единица, окружённая мембраной, в которой ДНК, белки и обмен веществ вместе работают в отграниченном внутреннем пространстве. Впервые есть чёткое внутри и снаружи.", "en": "a unit enclosed by a membrane, in which DNA, proteins and metabolism work together in a bounded interior. For the first time there is a clear inside and outside."}, {"de": "ein menschlicher Körper: ~200 Zelltypen, Dutzende Gewebearten, ~80 Organe, alle aus einer einzigen befruchteten Zelle mit identischem Genom", "ru": "человеческое тело: ~200 типов клеток, десятки видов тканей, ~80 органов — все из одной-единственной оплодотворённой клетки с идентичным геномом", "en": "a human body: ~200 cell types, dozens of tissue types, ~80 organs, all from a single fertilized cell with an identical genome"}, {"de": "viele Zellen mit demselben Bauplan schalten verschiedene Teile davon an und aus, werden dadurch verschieden (differenziert) und übernehmen Spezialaufgaben. Nervenzelle, Muskelzelle, Hautzelle, gleiches Buch, andere…", "ru": "многие клетки с одним и тем же планом строения включают и выключают разные его части, становятся благодаря этому разными (дифференцируются) и берут на себя специальные задачи. Нервная клетка, мышечная клетка, клетка кожи — одна и та же книга, другие…", "en": "many cells with the same blueprint switch different parts of it on and off, thereby become different (differentiated) and take on specialized tasks. Nerve cell, muscle cell, skin cell, same book, different…"}, {"de": "Organismen, das lebende Wesen als Ganzes (Einheit der Evolution)", "ru": "Организмы, живое существо как целое (единица эволюции)", "en": "Organisms, the living being as a whole (unit of evolution)"}, {"de": "heute grob ~10^7 bis 10^8 Arten geschätzt (nur ~2 Mio. wissenschaftlich beschrieben); jede ein Ast am selben Stammbaum", "ru": "сегодня оценивают примерно ~10^7 до 10^8 видов (лишь ~2 млн описаны научно); каждый — ветвь на одном и том же родословном древе", "en": "today roughly ~10^7 to 10^8 species estimated (only ~2 million scientifically described); each a branch on the same family tree"}, {"de": "eine integrierte, sich fortpflanzende Ganzheit aus Organen und Geweben, ein Lebewesen, das als eine Einheit lebt, altert und stirbt.", "ru": "интегрированная, размножающаяся целостность из органов и тканей — живое существо, которое живёт, стареет и умирает как единое целое.", "en": "an integrated, self-reproducing whole of organs and tissues, a living being that lives, ages and dies as one unit."}, {"de": "Ehrliche Größenordnung: ein einzelnes menschliches Gehirn trägt grob ~10^11 Neuronen (~86 Mrd., gemessen) mit ~10^14-10^15 Synapsen. Auf der Erde…", "ru": "Честный порядок величины: один человеческий мозг несёт примерно ~10^11 нейронов (~86 млрд, измерено) с ~10^14-10^15 синапсами. На Земле…", "en": "Honest order of magnitude: a single human brain carries roughly ~10^11 neurons (~86 billion, measured) with ~10^14-10^15 synapses. On Earth…"}, {"de": "Der Zustand dieser Dimension ist Materie, die ein inneres Modell ihrer selbst und ihrer Umwelt führt. Elektrochemische Muster in vernetzten Zellen bilden Wahrnehmung, Gedächtnis, Vorhersage und, beim Menschen, Sprache…", "ru": "Состояние этого измерения — материя, которая ведёт внутреннюю модель самой себя и своей среды. Электрохимические паттерны в связанных в сеть клетках образуют восприятие, память, предсказание и, у человека, речь…", "en": "The state of this dimension is matter that maintains an inner model of itself and its environment. Electrochemical patterns in networked cells form perception, memory, prediction and, in humans, language…"}, {"de": "Zeichen · Wort · Satz, die Dimensions-Leiter des Sinns", "ru": "Знак · слово · предложение, лестница измерений смысла", "en": "Sign · word · sentence, the dimensional ladder of meaning"}, {"de": "Kein Messwert, sondern eine Leiter der Bedeutung: aus 1 Buchstaben werden tausende Wörter, aus Wörtern unzählbar viele Sätze und Deutungen. Jede Stufe trägt mehr Möglichkeit als die darunter, und ihre Zahl ist keine ganze (nahe 15, nahe 16, nie genau).", "ru": "Не измеренное значение, а лестница значения: из 1 буквы возникают тысячи слов, из слов — несчётно много предложений и толкований. Каждая ступень несёт больше возможности, чем та, что под ней, и её число не целое (близко к 15, близко к 16, но никогда точно).", "en": "Not a measured value but a ladder of meaning: from 1 letter come thousands of words, from words uncountably many sentences and interpretations. Each rung carries more possibility than the one below, and its number is not a whole one (close to 15, close to 16, never exactly)."}, {"de": "Zwischen Bewusstsein und Computer liegt die Sprache, Juris Beispiel dafür, wie eine Ebene sich selbst einen Wert gibt und dadurch die nächste gebiert. Ein »b« ist erst Materie, dann ein Zeichen, dann der Anfang von Buch, Bauer, Brot. Aus »ich« entfaltet sich eine ganze Identität: Name, Körper, Gefühl. »Ich war da.«, drei Wörter, in denen unendlich viel Bedeutung stecken kann: wo war ich, wann, das Gewesensein selbst. Jede Stufe fügt eine Dimension hinzu. Ehrlich: das ist eine Illustration von Sprach-Ebenen und der Entstehung von Bedeutung, kein physikalischer Weltbau-Schritt, aber genau dasselbe Muster wie im ganzen Modell: im Übergang wird Information geboren.", "ru": "Между сознанием и компьютером лежит язык — пример Juri того, как один уровень сам придаёт себе значение и тем самым порождает следующий. «b» — сперва материя, затем знак, затем начало слов Buch, Bauer, Brot. Из «ich» разворачивается целая идентичность: имя, тело, чувство. «Ich war da.» — три слова, в которых может скрываться бесконечно много смысла: где я был, когда, само бытие-в-прошлом. Каждая ступень добавляет одно измерение. Честно: это иллюстрация языковых уровней и возникновения смысла, а не шаг физического построения мира, но ровно тот же паттерн, что и во всей модели: в переходе рождается информация.", "en": "Between consciousness and the computer lies language, Juri's example of how one level gives itself a value and thereby gives birth to the next. A \"b\" is first matter, then a sign, then the beginning of book, baker, bread. From \"I\" an entire identity unfolds: name, body, feeling. \"I was there.\", three words in which infinitely much meaning can be held: where was I, when, the having-been itself. Each rung adds a dimension. Honestly: this is an illustration of levels of language and the emergence of meaning, not a physical world-building step, but exactly the same pattern as in the whole model: in the transition, information is born."}, {"de": "Logik & Computer (die 0 und die 1)", "ru": "Логика и компьютер (0 и 1)", "en": "Logic & computer (the 0 and the 1)"}, {"de": "Von Menschenhand gebaut: erst raumgroße Röhrenrechner (Meter, Tonnen), dann Transistoren im Millimeter- und heute Nanometerbereich. Grundeinheit…", "ru": "Построено руками человека: сначала ламповые вычислительные машины размером с комнату (метры, тонны), затем транзисторы миллиметрового, а сегодня нанометрового масштаба. Базовая единица…", "en": "Built by human hands: first room-sized vacuum-tube computers (meters, tons), then transistors in the millimeter and today the nanometer range. Basic unit…"}, {"de": "Das Bewusstsein friert seine eigenen Denkregeln au&szlig;erhalb des Körpers ein: wahr/falsch wird zu 1/0, Strom an oder aus. Logik wird auf eine 2D-Ebene gedruckt und geschaltet, Lochkarten, Gatter, gedruckte Platinen.…", "ru": "Сознание замораживает собственные правила мышления вне тела: истина/ложь становится 1/0, ток включён или выключен. Логика печатается и коммутируется на 2D-плоскости — перфокарты, вентили, печатные платы.…", "en": "Consciousness freezes its own rules of thought outside the body: true/false becomes 1/0, current on or off. Logic is printed onto a 2D plane and switched, punch cards, gates, printed circuit boards.…"}, {"de": "Keine physische Groesse, Welten aus reiner Information. Ein Zustand kann winzig sein (ein Wort) oder riesig (eine ganze simulierte Landschaft);…", "ru": "Никакой физической величины — миры из чистой информации. Состояние может быть крошечным (одно слово) или огромным (целый смоделированный ландшафт);…", "en": "No physical magnitude, worlds of pure information. A state can be tiny (a word) or huge (an entire simulated landscape);…"}, {"de": "Aus 0/1 werden Worte, aus Worten werden Welten: Text, Bild, Klang, ganze begehbare Raeume entstehen rein aus Zahlen. Entscheidend auf der untersten Ebene: JEDER gueltige digitale Zustand traegt einen einzigartigen,…", "ru": "Из 0/1 возникают слова, из слов возникают миры: текст, изображение, звук, целые проходимые пространства возникают чисто из чисел. Решающее на самом нижнем уровне: КАЖДОЕ допустимое цифровое состояние несёт уникальный,…", "en": "From 0/1 come words, from words come worlds: text, image, sound, whole walkable spaces arise purely from numbers. Crucial at the lowest level: EVERY valid digital state carries a unique,…"}, {"de": "Vernetztes Kollektiv (das gekoppelte Netz)", "ru": "Связанный в сеть коллектив (сопряжённая сеть)", "en": "Networked collective (the coupled network)"}, {"de": "Planetar: Milliarden Menschen und Geräte ueber Kontinente hinweg dauerhaft gekoppelt, Signale nahe Lichtgeschwindigkeit durch Glasfaser und Funk.…", "ru": "Планетарно: миллиарды людей и устройств через континенты постоянно сопряжены, сигналы почти со скоростью света по оптоволокну и радиосвязи.…", "en": "Planetary: billions of people and devices permanently coupled across continents, signals near the speed of light through fiber optics and radio.…"}, {"de": "Die vielen einzelnen Bewusstseine der Kollektiv-Schicht koppeln sich nun technisch zusammen: nicht mehr nur ueber Sprache im selben Raum, sondern ueber ein weltweites Netz. Gedanken, Bilder und Daten fliessen zwischen…", "ru": "Многие отдельные сознания слоя коллектива теперь сопрягаются технически: уже не только через речь в одном помещении, а через всемирную сеть. Мысли, образы и данные текут между…", "en": "The many individual consciousnesses of the collective layer now couple together technically: no longer only through language in the same room, but through a worldwide network. Thoughts, images and data flow between…"}, {"de": "KI & verdichtete Logik (das Wissen im Topf)", "ru": "ИИ и сгущённая логика (знание в котле)", "en": "AI & condensed logic (the knowledge in the pot)"}, {"de": "Modelle mit Milliarden bis Billionen Parametern, trainiert auf einem großen Teil des vernetzten Wissens, gerechnet in riesigen Rechenzentren. Gross…", "ru": "Модели с миллиардами и триллионами параметров, обученные на большой части сетевого знания, вычисляемые в огромных дата-центрах. Больш…", "en": "Models with billions to trillions of parameters, trained on a large part of the networked knowledge, computed in huge data centers. Large…"}, {"de": "Das im Netz zusammengeflossene Wissen wird in einem Topf geformt und durch KI zu Mustern, Regeln und Zusammenhaengen verdichtet, zu etwas, das wie Logik antwortet. Aus vielen Stimmen wird eine verdichtende Instanz, die…", "ru": "Слившееся в сети знание формуется в едином котле и уплотняется ИИ до паттернов, правил и взаимосвязей — до чего-то, что отвечает как логика. Из многих голосов возникает уплотняющая инстанция, которая…", "en": "The knowledge that has flowed together in the network is shaped in a pot and condensed by AI into patterns, rules and connections, into something that answers like logic. Out of many voices arises a condensing instance that…"}, {"de": "Quantencomputer (die gerechnete Ueberlagerung)", "ru": "Квантовый компьютер (вычисляемая суперпозиция)", "en": "Quantum computer (the computed superposition)"}, {"de": "Physikalisch klein und extrem: einzelne Qubits nahe dem absoluten Nullpunkt, abgeschirmt gegen den kleinsten Stoerimpuls, heute einige hundert bis…", "ru": "Физически мало и экстремально: отдельные кубиты вблизи абсолютного нуля, экранированные от малейшего возмущающего импульса, сегодня от нескольких сотен до…", "en": "Physically small and extreme: individual qubits near absolute zero, shielded against the smallest disturbing impulse, today a few hundred up to…"}, {"de": "Statt Zustaende nur als 0 ODER 1 zu setzen, haelt ein Qubit 0 UND 1 in Ueberlagerung, bis gemessen wird. Der Rechner rechnet nicht eine Moeglichkeit nach der anderen, sondern greift in das Feld der Ueberlagerungen…", "ru": "Вместо того чтобы задавать состояния только как 0 ИЛИ 1, кубит удерживает 0 И 1 в суперпозиции, пока не будет произведено измерение. Вычислитель считает не одну возможность за другой, а обращается к полю суперпозиций…", "en": "Instead of setting states only as 0 OR 1, a qubit holds 0 AND 1 in superposition until it is measured. The computer does not compute one possibility after another but reaches into the field of superpositions…"}, {"de": "Überbewusstsein, alles verschmilzt zum Ganzen", "ru": "Сверхсознание, всё сливается в целое", "en": "Super-consciousness, everything merges into the whole"}, {"de": "unzählbar, fast weiß, die Einzelnen kaum noch zu trennen", "ru": "несчётно, почти бело, отдельные едва различимы", "en": "uncountable, almost white, the individuals barely separable anymore"}, {"de": "Alles Wissen, alle Verbindungen verschmelzen zu einem einzigen, fast weißen Ganzen, die Vielen werden ununterscheidbar, so wie am Anfang. Juris spekulativer Schluss-Gedanke, klar als solcher markiert.", "ru": "Всё знание, все связи сливаются в единое, почти белое целое, многие становятся неразличимыми — как в начале. Спекулятивная заключительная мысль Juri, ясно помеченная как таковая.", "en": "All knowledge, all connections merge into a single, almost white whole, the many become indistinguishable, just as at the beginning. Juri's speculative closing thought, clearly marked as such."}, {"de": "Rückkehr zur Null, der Kreis schließt sich", "ru": "Возвращение к нулю, круг замыкается", "en": "Return to zero, the circle closes"}, {"de": "aus dem fast weißen Ganzen wird ein einziger Punkt nahe der Null", "ru": "из почти белого целого возникает единственная точка вблизи нуля", "en": "the almost white whole becomes a single point near zero"}, {"de": "Das fast weiße Ganze kollabiert sanft zu einem einzigen Punkt nahe der Null, und aus ihm könnte alles von vorn beginnen. Ausdrücklich spekulativ.", "ru": "Почти белое целое мягко коллапсирует в единственную точку вблизи нуля, и из неё всё могло бы начаться сначала. Явно спекулятивно.", "en": "The almost white whole collapses gently into a single point near zero, and from it everything could begin anew. Explicitly speculative."}, {"de": "Dies ist ein MODELL, eine Illustration einer Hypothese, kein Beweis fürs Universum und keine „Information aus dem Nichts\". Alle Zahlen und Zeiten sind ehrliche Größenordnungen (grob, ~), keine Stoppuhr-Werte: die etablierten Schichten stützen sich auf echte Wissenschaft, ihre frühesten Kanten bleiben offen. Ω (die Null) und S₀ (die erste Unterscheidung) sind ausdrücklich philosophische Hypothese, vor bzw. am Anfang der Zeit; die Zukunfts-Layer sind spekulativ und klar markiert, und der „Selbstbezug\" ist eine Metapher, kein nachgewiesener Mechanismus.\n\n· · ·\n\n**Zeit: von relativ zu bedeutend (Juris Deutung im Rahmen der Hypothese).**\n\nFrüh, von Omega bis etwa den Sternen, ist „Zeit\" fast rein *relativ* und abstrakt: Es gibt nur wenige unterscheidbare Zustände, alles liegt nahe der Symmetrie, und die Reihenfolge n trägt kaum Information. Man könnte viele Schritte vertauschen, ohne dass viel verloren ginge.\n\n**Ab dem Leben**, Zellen, Organismen, Bewusstsein, wird Zeit *bedeutend*: Die Verzweigungsmenge B(S_n) wächst enorm, jeder Moment trägt Geschichte und Information. Evolution ist pfadabhängig und unumkehrbar, was einmal geschah, prägt alles Weitere. So bekommt Zeit Gewicht, Richtung und Bedeutung.\n\n*Ehrlich:* Das ist Juris Deutung, kein Lehrbuchsatz. Aber sie dockt an Echtes an, die thermodynamische Zeitrichtung (Entropie), die wachsende Komplexität des Zustandsraums und die belegte Pfadabhängigkeit der Evolution.\n\n**Rückkehr zur Null, ausdrücklich SPEKULATIV.**\n\nDer zyklische Schluss: Alles Aufgefaltete verschmilzt wieder zu einem nahen-0-Punkt, die anfängliche Symmetrie kehrt zurück, „das Bewusstsein kehrt zur Null zurück\", und aus diesem Punkt könnte der Kreis von vorn beginnen.\n\nDas ist **Juris poetische Schluss-Hypothese**, klar als solche gekennzeichnet. Sie ist verwandt mit zyklischen Kosmologien (ewige Wiederkehr, Big Crunch, Penrose' konforme zyklische Kosmologie), aber sie ist **keine etablierte Physik und kein Beweis**, und ausdrücklich kein Weltuntergangs-Kitsch. Ein gedachter Fluchtpunkt, der dem ganzen Bogen eine Form ohne Rand gibt: Ende und Anfang berühren sich.\n\n· · ·\n\n**Schicht = Dimension (Layer).** Juri liest jede Schicht als eine Dimension, eine Ebene der Betrachtung. Das ist bewusst weiter gefasst als der physikalische Dimensionsbegriff (Freiheitsgrade/Achsen); gemeint ist „eine Ebene tiefer oder höher schauen\". Ehrlich: Dass Dimensionen keine ganzen Zahlen sein müssen, hat einen echten Anker (fraktale/Hausdorff-Dimension); dass „die Menschheit bei 3,258\" stehe, ist ein Bild, kein Messwert. Wie überall gilt das 1−ε-Rückgrat: nahe an 0 und an 4, ohne sie je zu berühren.\n\n**Die Dimensions-Leiter des Sinns** (Zeichen · Wort · Satz) ist Juris Illustration zwischen Bewusstsein und Computer: Sprach-Ebenen und Entstehung von Bedeutung, kein physikalischer Weltbau-Schritt, aber dasselbe Muster wie überall, im Übergang wird Information geboren.", "ru": "Это МОДЕЛЬ, иллюстрация гипотезы, а не доказательство насчёт Вселенной и не «информация из ничего». Все числа и времена — честные порядки величин (грубо, ~), а не показания секундомера: устоявшиеся слои опираются на настоящую науку, их самые ранние края остаются открытыми. Ω (ноль) и S₀ (первое различие) — это явным образом философская гипотеза, до и в начале времени соответственно; будущие слои спекулятивны и ясно помечены, а «самоотнесение» — метафора, а не доказанный механизм.\n\n· · ·\n\n**Время: от относительного к значимому (толкование Juri в рамках гипотезы).**\n\nРано, от Омеги примерно до звёзд, «время» почти чисто *относительно* и абстрактно: есть лишь немного различимых состояний, всё лежит вблизи симметрии, и порядок n почти не несёт информации. Можно было бы переставить многие шаги, почти ничего не потеряв.\n\n**Начиная с жизни** — клетки, организмы, сознание — время становится *значимым*: множество ветвлений B(S_n) растёт колоссально, каждый момент несёт историю и информацию. Эволюция зависит от пути и необратима, что однажды случилось, определяет всё последующее. Так время обретает вес, направление и значение.\n\n*Честно:* это толкование Juri, а не тезис из учебника. Но оно смыкается с настоящим — термодинамическим направлением времени (энтропией), растущей сложностью пространства состояний и подтверждённой зависимостью эволюции от пути.\n\n**Возвращение к нулю, явно СПЕКУЛЯТИВНО.**\n\nЦиклическая развязка: всё развёрнутое снова сливается в точку вблизи-0, изначальная симметрия возвращается, «сознание возвращается к нулю», и из этой точки круг мог бы начаться сначала.\n\nЭто **поэтическая заключительная гипотеза Juri**, ясно обозначенная как таковая. Она родственна циклическим космологиям (вечное возвращение, Большое сжатие, конформная циклическая космология Пенроуза), но это **не устоявшаяся физика и не доказательство**, и подчёркнуто не китч о конце света. Мыслимая точка схода, придающая всей дуге форму без края: конец и начало соприкасаются.\n\n· · ·\n\n**Слой = измерение (Layer).** Juri читает каждый слой как измерение, уровень рассмотрения. Это сознательно шире, чем физическое понятие измерения (степени свободы/оси); имеется в виду «посмотреть на уровень ниже или выше». Честно: то, что измерения не обязаны быть целыми числами, имеет настоящий якорь (фрактальная/хаусдорфова размерность); а то, что «человечество на 3,258», — это образ, а не измеренное значение. Как и всюду, действует костяк 1−ε: близко к 0 и к 4, ни разу их не касаясь.\n\n**Лестница измерений смысла** (знак · слово · предложение) — иллюстрация Juri между сознанием и компьютером: языковые уровни и возникновение смысла, не шаг физического построения мира, но тот же паттерн, что и всюду, — в переходе рождается информация.", "en": "This is a MODEL, an illustration of a hypothesis, not a proof of the universe and not \"information out of nothing\". All numbers and times are honest orders of magnitude (rough, ~), not stopwatch values: the established layers rest on real science, their earliest edges remain open. Ω (the zero) and S₀ (the first distinction) are explicitly a philosophical hypothesis, before and at the beginning of time respectively; the future layers are speculative and clearly marked, and the \"self-reference\" is a metaphor, not a proven mechanism.\n\n· · ·\n\n**Time: from relative to meaningful (Juri's reading within the hypothesis).**\n\nEarly on, from Omega to about the stars, \"time\" is almost purely *relative* and abstract: there are only a few distinguishable states, everything lies close to symmetry, and the order n carries hardly any information. One could swap many steps without much being lost.\n\n**From life onward**, cells, organisms, consciousness, time becomes *meaningful*: the branching set B(S_n) grows enormously, every moment carries history and information. Evolution is path-dependent and irreversible, what once happened shapes everything that follows. Thus time gains weight, direction and meaning.\n\n*Honestly:* this is Juri's reading, not a textbook statement. But it docks onto something real, the thermodynamic arrow of time (entropy), the growing complexity of the state space, and the documented path-dependence of evolution.\n\n**Return to zero, explicitly SPECULATIVE.**\n\nThe cyclical conclusion: everything unfolded merges again into a near-0 point, the initial symmetry returns, \"consciousness returns to zero\", and from this point the circle could begin anew.\n\nThis is **Juri's poetic closing hypothesis**, clearly marked as such. It is related to cyclical cosmologies (eternal recurrence, Big Crunch, Penrose's conformal cyclic cosmology), but it is **not established physics and not a proof**, and explicitly not apocalyptic kitsch. An imagined vanishing point that gives the whole arc a form without edge: end and beginning touch.\n\n· · ·\n\n**Layer = dimension (Layer).** Juri reads each layer as a dimension, a level of consideration. This is deliberately broader than the physical concept of dimension (degrees of freedom/axes); what is meant is \"looking one level lower or higher\". Honestly: that dimensions need not be whole numbers has a real anchor (fractal/Hausdorff dimension); that \"humanity stands at 3,258\" is an image, not a measured value. As everywhere, the 1−ε backbone holds: close to 0 and to 4, without ever touching them.\n\n**The dimensional ladder of meaning** (sign · word · sentence) is Juri's illustration between consciousness and the computer: levels of language and the emergence of meaning, not a physical world-building step, but the same pattern as everywhere, in the transition information is born."}, {"de": "Die Frage: Bin ich, oder nicht?, der erste Schnitt setzt die Eine (0 Bit, noch kein Unterschied)", "ru": "Вопрос: есть ли я, или нет?, первый разрез задаёт Единую (0 бит, ещё нет различия)", "en": "The question: Am I, or not?, the first cut posits the One (0 bit, no difference yet)"}, {"de": "Die Frage: Gibt es ein Zweites?, der erste Unterschied, das erste Bit (log₂ 2 = 1).", "ru": "Вопрос: есть ли второе?, первое различие, первый бит (log₂ 2 = 1).", "en": "The question: Is there a second?, the first difference, the first bit (log₂ 2 = 1)."}, {"de": "Die Frage: Kann es sich verdoppeln?, aus <script>
/* ==========================================================================

             RAZ_MODEL = { strings:[{de,ru,en}, ...] }  (longest handled first)

   wholesale) and atomic data values (short keys). Nothing existing is edited;
   this only appends a switcher + a translation layer.

(function () {
  "use strict";
  var CFG   = (typeof RAZ_CFG   !== "undefined") ? RAZ_CFG   : { pos:"top-right" };

  var STR = (MODEL.strings || []).filter(function(e){return e&&e.de;}).slice()
              .sort(function (a, b) { return b.de.length - a.de.length; });
  function isL(ch){ return ch >= "0" && ch <= "9" || ch >= "A" && ch <= "Z" || ch >= "a" && ch <= "z" || (ch >= "À" && ch <= "ɏ"); }
  STR.forEach(function (e){ e._bl = isL(e.de.charAt(0)); e._br = isL(e.de.charAt(e.de.length-1)); });
  var memo = { ru:Object.create(null), en:Object.create(null) };
  function translateStr(s, lang){
    if (lang === "de" || !s || typeof s !== "string") return s;
    var mm = memo[lang]; var hit = mm[s]; if (hit !== undefined) return hit;
    var out = s;
    for (var i=0;i<STR.length;i++){
      var e = STR[i], tr = e[lang]; if (tr == null || tr === "") continue;
      if (out.indexOf(e.de) < 0) continue;
      var res="", from=0, k;
      while ((k = out.indexOf(e.de, from)) >= 0){
        var okL = !e._bl || k===0 || !isL(out.charAt(k-1));

        var okR = !e._br || aft>=out.length || !isL(out.charAt(aft));

  var htmlEls = [], textEls = [];
  function TAGof(el){ return (el && el.tagName ? el.tagName : "").toUpperCase(); }
  function skip(el){ if(!el||el.nodeType!==1) return false; var t=TAGof(el); if(t==="SCRIPT"||t==="STYLE") return true;

    });

  })();

  /* ---------- initial pass over static markup ----------------------------- */
  var INLINE={A:1,ABBR:1,B:1,BDI:1,BDO:1,BR:1,CITE:1,CODE:1,DATA:1,DFN:1,EM:1,I:1,KBD:1,MARK:1,Q:1,RP:1,RT:1,RUBY:1,S:1,SAMP:1,SMALL:1,SPAN:1,STRONG:1,SUB:1,SUP:1,TIME:1,U:1,VAR:1,WBR:1,DEL:1,INS:1};

  function hasText(el){ var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),n; while((n=w.nextNode())){ if(n.nodeValue&&/\S/.test(n.nodeValue))return true; } return false; }

  function hasBlockDesc(el){ var k=el.getElementsByTagName("*"); for(var i=0;i<k.length;i++){ if(INLINE[(k[i].tagName||"").toUpperCase()]!==1) return true; } return false; }

  /* ---------- apply a language ------------------------------------------- */

  }

  /* ---------- switcher UI ------------------------------------------------- */
  function buildBar(){
    var style=document.createElement("style"); style.id="raz-lang-style"; style.__razSkip=true;
    style.textContent="#raz-langbar{position:fixed;z-index:2147483000;display:inline-flex;gap:2px;padding:3px;border-radius:999px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em;line-height:1;background:rgba(20,21,29,.72);border:1px solid rgba(150,150,180,.28);box-shadow:0 6px 22px rgba(0,0,0,.4);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);}#raz-langbar .raz-lb-btn{appearance:none;border:0;background:transparent;cursor:pointer;color:#c9cee0;border-radius:999px;padding:.4em .62em;font:inherit;transition:background .15s,color .15s;}#raz-langbar .raz-lb-btn:hover{color:#fff;}#raz-langbar .raz-lb-btn.raz-on{background:rgba(230,181,74,.94);color:#141019;}";
    document.head.appendChild(style);
    var bar=document.createElement("div"); bar.id="raz-langbar"; bar.__razSkip=true; bar.setAttribute("role","group"); bar.setAttribute("aria-label","Sprache / Language / Язык");
