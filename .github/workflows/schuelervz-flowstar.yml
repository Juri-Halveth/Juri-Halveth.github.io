name: schuelerVZ FLOWSTAR

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "schuelerVZ STREAM UNIVERSE"
      - "schuelerVZ PRESTIGE FOUR 3.5.1"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: schuelervz-flowstar
  cancel-in-progress: false

jobs:
  flowstar:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: FLOWSTAR constellation
        run: |
          python schuelervz-halveth/tools/FLOWSTAR_ENGINE.py \
            --site-root schuelervz-halveth

      - name: Append constellation state
        run: |
          git config user.name "halveth-flowstar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            schuelervz-halveth/data/flowstar \
            schuelervz-halveth/FLOWSTAR.md \
            schuelervz-halveth/tools/FLOWSTAR_ENGINE.py

          bash schuelervz-halveth/tools/push_refresh_commit.sh "✦ flowstar: append constellation state"
