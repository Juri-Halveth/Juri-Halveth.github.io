name: Refresh schuelerVZ public archive
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0"
permissions:
  contents: read
jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Refresh public archive
        continue-on-error: true
        run: python schuelervz-halveth/tools/ingest_wayback.py --site-root schuelervz-halveth
      - name: Commit refreshed archive if changed
        run: |
          git config user.name "halveth-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schuelervz-halveth/archive schuelervz-halveth/data/archive-index.json
          git diff --cached --quiet || git commit -m "archive: refresh public schuelerVZ captures"
          git push
