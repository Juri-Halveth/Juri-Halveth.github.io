name: schuelerVZ PRESTIGE FOUR 3.5.1
on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * 0"

permissions:
  contents: read

concurrency:
  group: schuelervz-prestige-four
  cancel-in-progress: false

jobs:
  prestige:
    permissions:
      contents: write
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Export voluntary profile claims
        run: |
          gh api --paginate --method GET \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
            --jq '.[]' > /tmp/profile-claims.ndjson

      - name: PRESTIGE FOUR
        continue-on-error: true
        run: |
          python schuelervz-halveth/tools/PRESTIGE_FOUR_ENGINE.py \
            --site-root schuelervz-halveth \
            --issues-ndjson /tmp/profile-claims.ndjson \
            --rounds 4 \
            --fetch-per-round 35

      - name: Commit progressive state
        run: |
          git config user.name "halveth-prestige-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schuelervz-halveth
          git diff --cached --quiet || git commit -m "prestige: autonomous four-step refresh"
          git pull --rebase origin main
          git push origin main
