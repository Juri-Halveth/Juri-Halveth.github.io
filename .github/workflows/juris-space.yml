name: HALVETH portal contracts
on:
  push:
    paths: ['**']
  pull_request:
    paths: ['**']
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bash SPACE.sh build
      - run: git diff --exit-code -- index.html arbeiten/index.html profil/index.html profil/CV-Juri-Halveth.md 404.html handbuch docs/HANDBUCH.md en ru sitemap.xml
      - run: bash SPACE.sh check
      - run: node --check motion-player.js
      - run: node --check portal.js
      - run: node --check landing-motion.js
      - run: node --check universum/core.js
      - run: node --check universum/app.js
      - run: node --check tools/build-source-universe.cjs
      - run: node --check tools/build-universe-page.cjs
      - run: bash -n SPACE.sh
      - run: bash -n HUB.sh
