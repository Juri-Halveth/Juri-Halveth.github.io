name: Juris Space contracts
on:
  push:
    paths: ['index.html', 'portal.css', 'portal.js', 'space-*.js', 'SPACE.sh', 'data/juris-space.json', 'tools/*space.cjs', 'tests/space.test.cjs', '.github/workflows/juris-space.yml']
  pull_request:
    paths: ['index.html', 'portal.css', 'portal.js', 'space-*.js', 'SPACE.sh', 'data/juris-space.json', 'tools/*space.cjs', 'tests/space.test.cjs', '.github/workflows/juris-space.yml']
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash SPACE.sh build
      - run: git diff --exit-code -- index.html space-data.js
      - run: bash SPACE.sh check
      - run: bash -n SPACE.sh
