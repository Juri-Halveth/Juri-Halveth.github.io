name: HALVETH portal contracts
on:
  push:
    paths: ['.gitattributes', 'sitemap.xml', 'index.html', '404.html', 'portal.css', 'portal.js', 'return.css', 'language.css', 'handbook.css', 'handbuch/**', 'docs/HANDBUCH.md', 'HUB.sh', 'examples/**', 'en/**', 'ru/**', 'package*.json', 'assets/**', 'templates/**', 'arbeiten/**', 'koennen/**', 'profil/**', 'werkzertifikate/index.html', 'motion*', 'landing-motion.js', 'motion/**', 'SPACE.sh', 'data/**', 'tools/*.cjs', 'tests/*.test.cjs', '.github/workflows/juris-space.yml']
  pull_request:
    paths: ['.gitattributes', 'sitemap.xml', 'index.html', '404.html', 'portal.css', 'portal.js', 'return.css', 'language.css', 'handbook.css', 'handbuch/**', 'docs/HANDBUCH.md', 'HUB.sh', 'examples/**', 'en/**', 'ru/**', 'package*.json', 'assets/**', 'templates/**', 'arbeiten/**', 'koennen/**', 'profil/**', 'werkzertifikate/index.html', 'motion*', 'landing-motion.js', 'motion/**', 'SPACE.sh', 'data/**', 'tools/*.cjs', 'tests/*.test.cjs', '.github/workflows/juris-space.yml']
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bash SPACE.sh build
      - run: git diff --exit-code -- index.html arbeiten/index.html profil/index.html profil/CV-Juri-Halveth.md 404.html handbuch docs/HANDBUCH.md en ru sitemap.xml
      - run: bash SPACE.sh check
      - run: node --check motion-player.js
      - run: node --check portal.js
      - run: node --check landing-motion.js
      - run: bash -n SPACE.sh
      - run: bash -n HUB.sh
