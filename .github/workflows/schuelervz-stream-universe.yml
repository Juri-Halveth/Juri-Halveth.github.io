name: schuelerVZ STREAM UNIVERSE

on:
  workflow_dispatch:
  schedule:
    - cron: "13 2 * * 0"

permissions:
  contents: write

concurrency:
  group: schuelervz-stream-universe
  cancel-in-progress: false

jobs:

  stream:

    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Internet -> GitHub reconstruction stream
        run: |
          python schuelervz-halveth/tools/STREAM_COLLECTOR.py

      - name: Commit reconstructed public state
        run: |

          git config user.name "halveth-stream-bot"
          git config user.email "actions@users.noreply.github.com"

          git add schuelervz-halveth/data/stream

          bash schuelervz-halveth/tools/push_refresh_commit.sh "stream: ingest public schuelerVZ archaeology"
