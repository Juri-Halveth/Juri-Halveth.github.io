name: schuelerVZ STREAM UNIVERSE

on:
  workflow_dispatch:
  schedule:
    - cron: "13 2 * * 0"

permissions:
  contents: read

concurrency:
  group: schuelervz-stream-universe
  cancel-in-progress: false

jobs:

  stream:

    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Internet -> GitHub reconstruction stream
        run: |
          python schuelervz-halveth/tools/STREAM_COLLECTOR.py

      - name: Commit reconstructed public state
        run: |

          git config user.name "halveth-stream-bot"
          git config user.email "actions@users.noreply.github.com"

          git add schuelervz-halveth/data/stream

          if git diff --cached --quiet; then
            echo "No new public archaeology state."
            exit 0
          fi

          git commit -m "stream: ingest public schuelerVZ archaeology"

          git pull --rebase origin main

          git push origin main
