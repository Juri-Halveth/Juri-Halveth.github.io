name: Publish website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: website-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: git diff --exit-code
      - name: Refresh anonymous public inventory
        if: github.event_name != 'pull_request'
        run: |
          node tools/refresh-network-inventory.cjs
          npm run build
      - run: npm test
      - name: Install pinned Chromium for visitor flows
        timeout-minutes: 5
        # The GitHub Ubuntu 24.04 image already supplies the browser libraries.
        # Avoid an unrelated apt mirror update on every six-hour inventory refresh.
        run: npx playwright install --only-shell chromium
      - name: Check browser input, results and recovery links
        run: npm run test:browser
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Stage the tested static website
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/website"
          # Only tracked public files; on scheduled runs these include the newly
          # observed inventory and its tested generated views. Never copy node_modules.
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/website"
          test -f "$RUNNER_TEMP/website/.nojekyll"
          test -f "$RUNNER_TEMP/website/index.html"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/website
          # Preserve the existing static publication, including .nojekyll.
          include-hidden-files: true
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
