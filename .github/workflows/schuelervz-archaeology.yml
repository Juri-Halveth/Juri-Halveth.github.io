name: schuelerVZ autonomous archaeology
on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 0"
permissions:
  contents: read
concurrency:
  group: schuelervz-archaeology
  cancel-in-progress: false

jobs:
  archaeology:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run archaeology engine
        continue-on-error: true
        run: |
          python schuelervz-halveth/tools/HALVETH_ARCHAEOLOGY_ENGINE.py \
            --site-root schuelervz-halveth \
            --max-cdx 15000 \
            --cdx-pages 30 \
            --max-fetch 350
      - name: Commit progressive archive expansion
        run: |
          git config user.name "halveth-archaeology-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schuelervz-halveth
          git diff --cached --quiet || git commit -m "archive: autonomous archaeology refresh"
          git push
