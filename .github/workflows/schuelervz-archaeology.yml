name: schuelerVZ autonomous archaeology
on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 0"
permissions:
  contents: write
concurrency:
  group: schuelervz-archaeology
  cancel-in-progress: false

jobs:
  archaeology:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run archaeology engine
        continue-on-error: true
        run: |
          python schuelervz-halveth/tools/HALVETH_ARCHAEOLOGY_ENGINE.py \
            --site-root schuelervz-halveth \
            --max-cdx 15000 \
            --cdx-pages 30 \
            --max-fetch 350
      - name: Commit progressive archive expansion
        run: |
          git config user.name "halveth-archaeology-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schuelervz-halveth
          bash schuelervz-halveth/tools/push_refresh_commit.sh "archive: autonomous archaeology refresh"
