name: Profil wiederbeleben
description: Opt-in Claim für ein aktuelles schülerVZ // HALVETH Rekonstruktionsprofil
title: "[PROFILE CLAIM] "
body:
  - type: markdown
    attributes:
      value: |
        MYCELIUM fragt **niemals** nach deinem alten schülerVZ-Passwort.
        Dein heutiger GitHub-Account ist die Claim-Identität.
        Ein Claim macht aus einer historischen Spur nicht automatisch eine verifizierte Alt-Identität.
  - type: input
    id: display
    attributes:
      label: Anzeigename
    validations:
      required: true
  - type: input
    id: historic_url
    attributes:
      label: Deine eigene alte Profil-URL (optional)
      description: Nur dein eigenes historisches Profil.
  - type: input
    id: historic_id
    attributes:
      label: Deine eigene alte opaque Profil-ID (optional)
  - type: input
    id: email_fingerprint
    attributes:
      label: Optionaler SHA-256-Fingerprint der alten E-Mail
      description: Keine Klartext-E-Mail und niemals ein Passwort.
  - type: checkboxes
    id: consent
    attributes:
      label: Einwilligung
      options:
        - label: Ich beantrage nur die Rekonstruktion meines eigenen Profils.
          required: true
        - label: Ich bin mit der Veröffentlichung des neuen Rekonstruktionsprofils einverstanden.
          required: true
