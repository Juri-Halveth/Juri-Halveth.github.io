<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
<title id="title">FORTUNA – lokales Wahrscheinlichkeitslabor</title>
<desc id="description">Technische Konzeptgrafik: eine einstellbare Ereigniswahrscheinlichkeit p gleich n durch d, bis zu einer Million lokale Ziehungen pro Versuch, Treffertest und Wiederherstellung der Ausgangskonfiguration. Keine Verbindung zu einem fremden Server.</desc>
<defs>
  <linearGradient id="background" x2="1" y2="1"><stop stop-color="#06101e"/><stop offset=".54" stop-color="#101a2c"/><stop offset="1" stop-color="#151323"/></linearGradient>
  <linearGradient id="flow" x2="1"><stop stop-color="#b88aff"/><stop offset=".55" stop-color="#60c6f7"/><stop offset="1" stop-color="#49e3bd"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#885ee9" stop-opacity=".24"/><stop offset="1" stop-color="#885ee9" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9eb4e7" stroke-opacity=".055"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1 1l5.5 3L1 7" fill="none" stroke="#7598bc" stroke-width="1.3"/></marker>
</defs>
<style>
  .mono{font-family:Consolas,'Liberation Mono',monospace}
  .sans{font-family:Arial,'Helvetica Neue',sans-serif}
  .eyebrow{fill:#bfc9df;font-size:12px;font-weight:700;letter-spacing:2px}
  .label{fill:#8fa4c1;font-size:12px;font-weight:700;letter-spacing:1.3px}
  .small{fill:#aabbd0;font-size:12px}
  .panel{fill:#0d1a2b;fill-opacity:.91;stroke:#3b587a;stroke-opacity:.64}
</style>
<rect width="960" height="540" fill="url(#background)"/><rect width="960" height="540" fill="url(#grid)"/>
<ellipse cx="520" cy="274" rx="440" ry="244" fill="url(#halo)"/>
<path d="M35 133H925" stroke="#52657f" stroke-opacity=".5"/>
<text x="46" y="38" class="mono eyebrow" fill="#cfb7ff">HALVETH / FORSCHUNGSMODELL  ·  01</text>
<text x="44" y="94" class="sans" font-size="48" font-weight="800" letter-spacing="-2" fill="#f4f7fb">FORTUNA</text>
<text x="330" y="88" class="sans" font-size="20" font-weight="600" fill="#c9d7e7">Chance als wiederholbarer Versuch.</text>
<text x="332" y="111" class="mono small">Eigener Zufallskern · exakte p(E) · dokumentierte Serien</text>
<g transform="translate(710 25)"><rect width="204" height="87" rx="12" fill="#17233a" stroke="#9a83d2" stroke-opacity=".75"/>
  <text x="15" y="23" class="mono label" fill="#c5acee">SERIENLÄNGE</text>
  <text x="15" y="54" class="mono" font-size="25" font-weight="700" fill="#f5efff">1–1.000.000</text>
  <text x="15" y="73" class="mono" font-size="11" fill="#b9d1de">999.999 eingeschlossen</text></g>
<rect x="45" y="153" width="235" height="254" rx="16" class="panel"/>
<rect x="295" y="153" width="365" height="254" rx="16" class="panel"/>
<rect x="675" y="153" width="240" height="254" rx="16" class="panel"/>
<text x="64" y="182" class="mono eyebrow">01  PARAMETER</text>
<circle cx="161" cy="270" r="68" fill="#241b43" stroke="#755d9c"/>
<circle cx="161" cy="270" r="55" fill="none" stroke="#c99bff" stroke-width="8" stroke-dasharray="212 346" transform="rotate(-90 161 270)" stroke-linecap="round"/>
<circle cx="161" cy="270" r="42" fill="#101d31" stroke="#50477a"/>
<text x="161" y="262" text-anchor="middle" class="mono" font-size="18" font-weight="700" fill="#e2ceff">p(E)</text>
<text x="161" y="287" text-anchor="middle" class="mono" font-size="17" fill="#f2f5fb">n / d</text>
<text x="64" y="365" class="mono small">0 ≤ n ≤ d</text>
<text x="64" y="385" class="mono small">lokal konfigurierbar</text>
<text x="314" y="182" class="mono eyebrow">02  ZIEHUNGEN</text>
<text x="314" y="209" class="sans" font-size="15" font-weight="600" fill="#dbe8f7">Ein Versuch. Viele lokale Ziehungen.</text>
<path d="M319 282H637" stroke="#9471ca" stroke-width="14" stroke-opacity=".19" filter="url(#soft)"/>
<path d="M319 282H637" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round"/>
<g fill="#d6b2ff" stroke="#18233c" stroke-width="4">
  <circle cx="332" cy="282" r="12"/><circle cx="375" cy="282" r="12"/><circle cx="418" cy="282" r="12"/>
  <circle cx="461" cy="282" r="12"/><circle cx="504" cy="282" r="12"/><circle cx="547" cy="282" r="12"/>
  <circle cx="590" cy="282" r="12"/><circle cx="633" cy="282" r="12"/></g>
<g fill="#735baf"><circle cx="375" cy="282" r="4"/><circle cx="461" cy="282" r="4"/><circle cx="547" cy="282" r="4"/></g>
<text x="319" y="246" class="mono small">r1</text><text x="405" y="246" class="mono small">r3</text>
<text x="519" y="246" class="mono small">···</text><text x="610" y="246" class="mono small">rk</text>
<path d="M314 336H640" stroke="#547295" stroke-opacity=".55"/>
<text x="314" y="362" class="mono" font-size="15" font-weight="700" fill="#d8e7f8">r_i ∈ {0, …, d−1}</text>
<text x="314" y="385" class="mono small">k = 1 … 1.000.000 · nur dieses Modell</text>
<text x="694" y="182" class="mono eyebrow">03  ZIELEREIGNIS E</text>
<circle cx="796" cy="251" r="45" fill="none" stroke="#284a5a" stroke-width="12"/>
<circle cx="796" cy="251" r="36" fill="none" stroke="#56d8bf" stroke-width="2"/>
<circle cx="796" cy="251" r="23" fill="none" stroke="#56d8bf" stroke-opacity=".8" stroke-width="2"/>
<circle cx="796" cy="251" r="8" fill="#56d8bf"/>
<path d="M765 282l-24 22m87-22 24 22" stroke="#6c9baf" stroke-width="1.4"/>
<rect x="694" y="320" width="8" height="8" rx="2" fill="#56d8bf"/>
<text x="710" y="328" class="mono" font-size="13" fill="#d4f4e9">r_i &lt; n  →  TREFFER</text>
<rect x="694" y="350" width="8" height="8" rx="2" fill="#ffb38e"/>
<text x="710" y="358" class="mono" font-size="13" fill="#f7d7ca">r_i ≥ n  →  SONST</text>
<text x="694" y="386" class="mono small">Treffer / Ziehungen als Beleg</text>
<g stroke="url(#flow)" stroke-width="2" fill="none" opacity=".8"><path d="M280 282h15"/><path d="M660 282h15"/></g>
<path d="M46 428H914" stroke="#52657f" stroke-opacity=".5"/>
<text x="47" y="455" class="mono label">KONTROLLIERTER ABLAUF</text>
<g class="mono" font-size="12" font-weight="700" fill="#d2e0f0">
  <text x="47" y="483">AUSGANGSWERT</text><text x="257" y="483">BASELINE</text>
  <text x="432" y="483">p(E) ÄNDERN + SERIE</text><text x="705" y="483">RÜCKSTELLEN + BELEG</text></g>
<g stroke="#7598bc" stroke-width="1.4" marker-end="url(#arrow)"><path d="M181 478h54"/><path d="M340 478h72"/><path d="M616 478h70"/></g>
<path d="M45 500H915" stroke="#52657f" stroke-opacity=".5"/>
<text x="46" y="523" class="mono" font-size="11" font-weight="700" letter-spacing=".45" fill="#a9bdd3">SCHEMATISCH · KEIN SCREENSHOT</text>
<text x="915" y="523" text-anchor="end" class="mono" font-size="11" letter-spacing=".4" fill="#8cb4c5">LOKALES MODELL · KEINE FREMD-SERVER-ANBINDUNG</text>
</svg>
